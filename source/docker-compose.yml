services:
  temp-mail:
    build: .
    container_name: temp-mail
    restart: unless-stopped
    ports:
      # WEB_PORT / SMTP_PORT 由 .env 文件或部署脚本注入
      - "${WEB_PORT:-6060}:6060"   # Web 前端访问端口
      - "${SMTP_PORT:-25}:25"      # SMTP 邮件接收端口
    volumes:
      # 持久化数据库，防止容器重启丢失邮件
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - FRONT_RETENTION_MINUTES=10
      - BACKEND_RETENTION_DAYS=7
      - MAILBOX_VALIDITY_HOURS=24
      # 如需自定义密钥可取消注释
      # - FLASK_SECRET_KEY=your-secure-random-key-here
    healthcheck:
      # 使用 python 内置检测，无需额外安装 curl
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:6060/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
